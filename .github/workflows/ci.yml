name: verify
on: [push, pull_request]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: spreadlock_test}
        ports: ['15483:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:15483/spreadlock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: v1.5.1}
      - run: npm ci --ignore-scripts
      - name: Reproducible checks and coverage gates
        run: npm run verify:release
      # Raw logs/reports can contain internal deployment details. Keep them local;
      # the verification runner prints only its gate status summary to this job.
